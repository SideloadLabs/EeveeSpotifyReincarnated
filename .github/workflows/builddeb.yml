name: Build rootless + RootHide .debs + Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create/use for the draft release (e.g. v6.6.3.1)"
        required: true
        default: "v6.6.3.1"
      release_name:
        description: "Release title (optional)"
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build-debs:
    name: Build ${{ matrix.label }} .deb
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            label: rootless
            theos_repository: theos/theos
          - scheme: roothide
            label: RootHide
            theos_repository: roothide/theos

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3.0"

      - name: Checkout ${{ matrix.label }} Theos
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.theos_repository }}
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build EeveeSwiftProtobuf.framework
        run: make build-eeveeswiftprotobuf

      - name: Test ad and Premium banner filtering
        run: |
          swiftc \
            Sources/EeveeSpotify/Premium/Helpers/BrowsitaSectionStripper.swift \
            Tests/BrowsitaSectionStripper/main.swift \
            -o "$RUNNER_TEMP/browsita-section-stripper-tests"
          "$RUNNER_TEMP/browsita-section-stripper-tests"
          swiftc \
            Sources/EeveeSpotify/Shared/Models/Extensions/URL+Extension.swift \
            Tests/URLAdClassification/main.swift \
            -o "$RUNNER_TEMP/url-ad-classification-tests"
          "$RUNNER_TEMP/url-ad-classification-tests"
          swiftc \
            Sources/EeveeSpotify/Premium/Helpers/ServerSidedFeaturePolicy.swift \
            Tests/ServerSidedFeaturePolicy/main.swift \
            -o "$RUNNER_TEMP/server-sided-feature-policy-tests"
          "$RUNNER_TEMP/server-sided-feature-policy-tests"
          swiftc \
            Sources/EeveeSpotify/Premium/Helpers/BundledConfigurationPolicy.swift \
            Tests/BundledConfigurationPolicy/main.swift \
            -o "$RUNNER_TEMP/bundled-configuration-policy-tests"
          "$RUNNER_TEMP/bundled-configuration-policy-tests"
          python3 Tests/ResolveConfigurationSnapshot/test.py

      - name: Build ${{ matrix.label }} .deb
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"
          ls -la packages

      - name: Stage ${{ matrix.label }} artifact
        run: |
          mkdir -p Outputs/DEBS
          DEB_PATH="$(ls -t packages/*.deb | head -n 1)"
          [ -n "$DEB_PATH" ] || { echo "No .deb produced" >&2; exit 1; }
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            OUT_NAME="$(basename "$DEB_PATH" .deb)-roothide.deb"
          else
            OUT_NAME="$(basename "$DEB_PATH")"
          fi
          cp -f "$DEB_PATH" "Outputs/DEBS/$OUT_NAME"

      - name: Validate package metadata and layout
        run: |
          DEB_PATH="$(find Outputs/DEBS -name '*.deb' -type f | head -n 1)"
          dpkg-deb --info "$DEB_PATH"
          dpkg-deb --contents "$DEB_PATH"
          EXTRACT_DIR="$RUNNER_TEMP/eevee-deb-${{ matrix.scheme }}"
          dpkg-deb -x "$DEB_PATH" "$EXTRACT_DIR"
          DYLIB_PATH="$(find "$EXTRACT_DIR" -name 'EeveeSpotify.dylib' -type f | head -n 1)"
          [ -n "$DYLIB_PATH" ] || { echo "EeveeSpotify.dylib missing" >&2; exit 1; }
          for marker in \
            AdsSponsoredContextServiceImpl \
            AdsSponsoredContextNPBAttachmentServiceImpl \
            AdsSponsoredPlaylistHeaderServiceImpl \
            SelfLoadingUpsellBannerUIView \
            ReferralsUpsellCardElementServiceImpl \
            DownloadUpsellService \
            FreeHostedJamsUpsellServiceImpl \
            FreeUserSkipUpsellPageService \
            FreeUserShuffleUpsellSheetPageService \
            premium_gated_start_jam_buttons_enabled \
            playlist_downloading_popup \
            downloadToggledWithCurrentAvailability:addAction:removeAction:pageIdentifier:pageURI:interactionID:; do
            strings "$DYLIB_PATH" | grep -Fq "$marker" || {
              echo "Compiled banner blocker marker missing: $marker" >&2
              exit 1
            }
          done
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            [ "$(dpkg-deb -f "$DEB_PATH" Architecture)" = "iphoneos-arm64e" ]
          fi

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-${{ matrix.label }}-DEB
          path: Outputs/DEBS/*.deb
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: build-debs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both packages
        uses: actions/download-artifact@v4
        with:
          pattern: EeveeSpotify-*-DEB
          path: Outputs/DEBS
          merge-multiple: true

      - name: Draft GitHub Release and attach both .debs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: Outputs/DEBS/*.deb
